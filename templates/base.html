<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %} Joyería Resplandor {% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>

    <header style="background-color: #2c3e50; color: white; padding: 20px; text-align: center;">
        <h1>💎 Joyería Resplandor</h1>
        <nav>
            <a href="{{ url_for('inicio') }}" style="color: gold; margin: 10px; text-decoration: none;">Inicio</a> | 
            <a href="{{ url_for('about') }}" style="color: gold; margin: 10px; text-decoration: none;">Nosotros</a> | 
            <a href="{{ url_for('catalogo') }}" style="color: gold; margin: 10px; text-decoration: none;">Catálogo</a>
        </nav>
    </header>

    <hr>

    <main style="padding: 40px; min-height: 300px;">
        {% block content %}
        {% endblock %}
    </main>

    <hr>

    <footer style="text-align: center; font-size: 0.9em; color: gray;">
        <p>&copy; 2026 Joyería Resplandor | Quito, Ecuador</p>
    </footer>

</body>
</html>
